<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduAdmin Pro - Panel Siswa</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f1f5f9; margin: 0; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
    h2 { color: #1e293b; margin-top: 0; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
    .form-group { margin-bottom: 15px; }
    label { font-weight: 600; display: block; margin-bottom: 6px; color: #334155; }
    select, textarea, input[type="text"] { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 14px; box-sizing: border-box; }
    .btn-kirim { background-color: #0d9488; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 20px; }
    .btn-kirim:hover { background-color: #0f766e; }
    
    /* Layout khusus mencocokkan */
    .match-card { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; padding: 15px; margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .match-item { flex: 1; text-align: center; }
    .match-item img { max-width: 100%; max-height: 120px; border-radius: 6px; }
    .mt-3 { margin-top: 20px; }
  </style>
</head>
<body>

  <div class="container">
    <h2>EduAdmin Pro - Panel Ujian Siswa</h2>

    <!-- Pilih Kelas -->
    <div class="form-group">
      <label for="select-kelas">Pilih Kelas:</label>
      <select id="select-kelas">
        <option value="">-- Memuat Kelas... --</option>
      </select>
    </div>

    <!-- Pilih Nama Siswa -->
    <div class="form-group">
      <label for="select-siswa">Pilih Nama Siswa:</label>
      <select id="select-siswa" disabled>
        <option value="">-- Pilih Kelas Terlebih Dahulu --</option>
      </select>
    </div>

    <!-- Pilihan Jenis Kuis / Modul -->
    <div class="form-group">
      <label for="select-modul">Pilih Jenis Kuis / Modul:</label>
      <select id="select-modul">
        <option value="pilihan ganda">1. Soal PG & Essay</option>
        <option value="mencocokkan gambar">2. Mencocokkan Gambar</option>
        <option value="puzzle kata">3. Puzzle Kata</option>
        <option value="ringkasan">4. Merangkum Materi</option>
      </select>
    </div>

    <hr style="margin: 20px 0; border: 0; border-top: 1px solid #e2e8f0;">

    <!-- Dynamic Container Tempat Soal Tampil Sesuai Mode -->
    <div id="container-soal">
      <p style="text-align: center; color: #64748b;">Memuat kuis...</p>
    </div>

    <!-- Tombol Kirim -->
    <button class="btn-kirim" onclick="kirimJawabanSiswa()">Selesai & Kirim Jawaban</button>

    <!-- Wadah Histori Nilai Siswa -->
    <div id="container-histori" class="mt-3"></div>
  </div>

  <!-- Memanggil file script eksternal -->
  <script src="siswa.js"></script>
</body>
</html>
