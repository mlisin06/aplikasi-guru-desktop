<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduAdmin Pro - Panel Siswa</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            background-color: #f1f5f9;
        }
        .sidebar {
            width: 250px;
            background-color: #1e293b;
            color: #ffffff;
            min-height: 100vh;
            padding: 20px 10px;
            box-sizing: border-box;
        }
        .sidebar h2 {
            font-size: 18px;
            margin-bottom: 20px;
            padding-left: 10px;
            color: #38bdf8;
        }
        .sidebar ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .sidebar li {
            margin-bottom: 5px;
        }
        .sidebar a {
            color: #cbd5e1;
            text-decoration: none;
            display: block;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
        }
        .sidebar a:hover {
            background-color: #334155;
            color: #ffffff;
        }
        .main-content {
            flex: 1;
            padding: 30px;
            box-sizing: border-box;
        }
        .card {
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            margin-top: 15px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }
        .form-control {
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #94a3b8;
            box-sizing: border-box;
        }
        .btn-primary {
            padding: 10px 20px;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

  <!-- SIDEBAR NAVIGATION SISWA -->
  <div class="sidebar">
    <h2>Ruang Siswa</h2>
    <ul>
      <li><a href="index.html">🏠 Beranda Utama</a></li>
      <li><a href="#" onclick="showSection('kerjakan-kuis')">📝 Kerjakan Kuis</a></li>
      <li><a href="#" onclick="showSection('materi')">📚 Lihat Materi</a></li>
    </ul>
  </div>

  <!-- MAIN CONTENT -->
  <div class="main-content">
    <section id="kerjakan-kuis">
      <h2>Panel Ujian & Tugas Siswa</h2>
      <div class="card">
        <div class="form-group">
          <label>Pilih Nama Siswa:</label>
          <select id="select-siswa" class="form-control">
            <option value="">-- Memuat Data Siswa --</option>
          </select>
        </div>
        <div class="form-group">
          <label>Pilih Jenis Kuis / Modul:</label>
          <select id="select-modul" class="form-control">
            <option value="pg">1. Soal PG & Essay</option>
            <option value="gambar">2. Mencocokkan Gambar</option>
            <option value="kata">3. Mencocokkan Kata</option>
            <option value="rangkum">4. Merangkum Materi</option>
          </select>
        </div>
        <div id="container-soal" style="margin-top: 20px;">
          <p>Memuat kuis...</p>
        </div>
        <button onclick="kirimJawabanSiswa()" class="btn-primary" style="margin-top: 20px;">🚀 Selesai & Kirim Jawaban</button>
      </div>
    </section>
  </div>

  <script src="siswa.js"></script>
</body>
</html>
