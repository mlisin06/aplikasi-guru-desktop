<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruang Ujian & Tugas Siswa - Portal Pembelajaran</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); min-height: 100vh; }
        .main-header { background: linear-gradient(135deg, #0061ff 0%, #60efff 100%); color: white; border-radius: 15px; box-shadow: 0 10px 20px rgba(0, 97, 255, 0.15); }
        .card-filter { border: none; border-radius: 15px; box-shadow: 0 8px 25px rgba(0,0,0,0.07); background: #ffffff; }
        .quiz-card { border: none; border-left: 6px solid #0061ff; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .form-control { border-radius: 10px; padding: 10px 15px; height: calc(1.5em + 1rem + 2px); }
        .btn-custom { border-radius: 10px; padding: 12px 20px; font-weight: 600; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .puzzle-box { background: #f8f9fa; border: 2px dashed #0061ff; border-radius: 12px; padding: 20px; }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="main-header p-4 mb-4 text-center">
            <h2 class="font-weight-bold mb-2">🎓 Ruang Ujian & Tugas Siswa</h2>
            <p class="mb-0 text-white-50">Silakan pilih kelas, nama Anda, dan materi pelajaran dengan teliti sebelum mengerjakan!</p>
        </div>

        <div class="card card-filter p-4 mb-4">
            <h5 class="text-primary font-weight-bold mb-3">📋 Identitas & Pilih Kuis</h5>
            <div class="form-row">
                <div class="form-group col-md-3">
                    <label class="font-weight-bold text-muted small">Pilih Kelas</label>
                    <select id="pilih-kelas" class="form-control" onchange="muatNamaSiswa()">
                        <option value="">-- Pilih Kelas --</option>
                        <option value="Kelas 1">Kelas 1</option>
                        <option value="Kelas 2">Kelas 2</option>
                        <option value="Kelas 3">Kelas 3</option>
                        <option value="Kelas 4">Kelas 4</option>
                        <option value="Kelas 5">Kelas 5</option>
                        <option value="Kelas 6">Kelas 6</option>
                    </select>
                </div>
                
                <div class="form-group col-md-3">
                    <label class="font-weight-bold text-muted small">Nama Lengkap Siswa</label>
                    <select id="pilih-nama" class="form-control">
                        <option value="">-- Pilih Kelas Dulu --</option>
                    </select>
                </div>

                <div class="form-group col-md-3">
                    <label class="font-weight-bold text-muted small">Mata Pelajaran</label>
                    <select id="pilih-mapel" class="form-control">
                        <option value="">-- Pilih Mapel --</option>
                        <option value="PAIBP">PAIBP</option>
                        <option value="Pendidikan Pancasila">Pendidikan Pancasila</option>
                        <option value="Bahasa Indonesia">Bahasa Indonesia</option>
                        <option value="Matematika">Matematika</option>
                        <option value="IPAS">IPAS</option>
                        <option value="PJOK">PJOK</option>
                        <option value="Bahasa Inggris">Bahasa Inggris</option>
                        <option value="Bahasa Jawa">Bahasa Jawa</option>
                    </select>
                </div>

                <div class="form-group col-md-3">
                    <label class="font-weight-bold text-muted small">Jenis Kuis / Tugas</label>
                    <select id="pilih-jenis" class="form-control">
                        <option value="">-- Pilih Jenis --</option>
                        <option value="Pilihan Ganda">Pilihan Ganda</option>
                        <option value="Essay">Essay</option>
                        <option value="Mencocokkan Gambar">Mencocokkan Gambar</option>
                        <option value="Puzzle">Puzzle</option>
                        <option value="Menulis Ringkasan Materi">Menulis Ringkasan Materi</option>
                    </select>
                </div>
            </div>

            <button type="button" class="btn btn-primary btn-custom btn-block mt-2" onclick="muatDaftarSoal()">
                🚀 Muat Soal & Tugas Sekarang
            </button>
        </div>

        <div id="kontainer-soal">
            <div class="card card-filter text-center py-5">
                <h5 class="text-muted">✨ Silakan pilih kelas, nama, mapel, dan jenis kuis di atas!</h5>
            </div>
        </div>

        <div class="mt-4 text-center">
            <a href="index.html" class="btn btn-light btn-custom text-muted border">&larr; Kembali ke Beranda Utama</a>
        </div>
    </div>

    <script>
        // Fungsi otomatis memuat nama siswa berdasarkan kelas yang dipilih
        function muatNamaSiswa() {
            let kelasDipilih = document.getElementById("pilih-kelas").value;
            let dropdownNama = document.getElementById("pilih-nama");
            
            dropdownNama.innerHTML = '<option value="">-- Pilih Nama Siswa --</option>';

            if (!kelasDipilih) return;

            let dataSiswa = JSON.parse(localStorage.getItem("dataSiswa")) || [];
            let siswaFilter = dataSiswa.filter(s => s.kelas === kelasDipilih);

            if (siswaFilter.length === 0) {
                dropdownNama.innerHTML = '<option value="">(Belum ada siswa terdaftar di kelas ini)</option>';
                return;
            }

            siswaFilter.forEach(s => {
                let opt = document.createElement("option");
                opt.value = s.nama;
                opt.textContent = s.nama;
                dropdownNama.appendChild(opt);
            });
        }

        function acakHuruf(kata) {
            if (!kata) return "";
            let arr = kata.trim().split("");
            for (let i = arr.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            let hasilAcak = arr.join(" ");
            if (hasilAcak.replace(/\s+/g, '') === kata.trim() && kata.length > 2) {
                return acakHuruf(kata);
            }
            return hasilAcak;
        }

        function muatDaftarSoal() {
            let kelas = document.getElementById("pilih-kelas").value;
            let nama = document.getElementById("pilih-nama").value;
            let mapel = document.getElementById("pilih-mapel").value;
            let jenis = document.getElementById("pilih-jenis").value;
            let kontainer = document.getElementById("kontainer-soal");

            if (!kelas || !nama || !mapel || !jenis) {
                alert("Harap lengkapi Kelas, Nama Siswa, Mata Pelajaran, dan Jenis Kuis terlebih dahulu!");
                return;
            }

            let dataSoal = JSON.parse(localStorage.getItem("dataSoal")) || [];
            let soalFilter = dataSoal.filter(s => s.kelas === kelas && s.mapel === mapel && s.jenis === jenis);

            if (soalFilter.length === 0) {
                kontainer.innerHTML = `
                    <div class="card card-filter text-center py-5">
                        <h5 class="text-danger">⚠️ Belum ada soal/tugas untuk <b>${kelas} - ${mapel} (${jenis})</b>.</h5>
                    </div>`;
                return;
            }

            let htmlContent = "";
            soalFilter.forEach((soal, index) => {
                htmlContent += `<div class="card quiz-card mb-4 p-4 bg-white">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <h5 class="text-primary font-weight-bold mb-0">Soal No. ${index + 1}</h5>
                        <span class="badge badge-info px-3 py-2" style="font-size: 12px; border-radius: 20px;">${soal.jenis}</span>
                    </div>
                    <p class="font-weight-bold mt-2 text-dark" style="font-size: 1.05rem;">${soal.pertanyaan}</p>`;

                if (soal.jenis === "Pilihan Ganda") {
                    htmlContent += `
                        <div class="custom-control custom-radio mb-2"><input class="custom-control-input" type="radio" id="optA_${index}" name="jawaban_${index}" value="A"><label class="custom-control-label" for="optA_${index}">A. ${soal.opsiA}</label></div>
                        <div class="custom-control custom-radio mb-2"><input class="custom-control-input" type="radio" id="optB_${index}" name="jawaban_${index}" value="B"><label class="custom-control-label" for="optB_${index}">B. ${soal.opsiB}</label></div>
                        <div class="custom-control custom-radio mb-2"><input class="custom-control-input" type="radio" id="optC_${index}" name="jawaban_${index}" value="C"><label class="custom-control-label" for="optC_${index}">C. ${soal.opsiC}</label></div>
                        <div class="custom-control custom-radio"><input class="custom-control-input" type="radio" id="optD_${index}" name="jawaban_${index}" value="D"><label class="custom-control-label" for="optD_${index}">D. ${soal.opsiD}</label></div>
                    `;
                } else if (soal.jenis === "Essay") {
                    htmlContent += `<div class="form-group mt-3"><textarea id="jawaban_${index}" class="form-control" rows="3" placeholder="Tulis jawaban essay Anda..."></textarea></div>`;
                } else if (soal.jenis === "Mencocokkan Gambar") {
                    htmlContent += `
                        <div class="mb-3 text-center">${soal.gambar ? `<img src="${soal.gambar}" class="img-fluid rounded shadow-sm border mb-2" style="max-height: 220px;" alt="Gambar Soal">` : ''}</div>
                        <div class="form-group"><input type="text" id="jawaban_${index}" class="form-control" placeholder="Tulis jawaban atau pasangan..."></div>
                    `;
                } else if (soal.jenis === "Puzzle") {
                    let hurufAcak = acakHuruf(soal.kunci || "SEKOLAH");
                    htmlContent += `
                        <div class="puzzle-box text-center my-3">
                            <span class="text-muted small d-block mb-1 font-weight-bold">SUSUNLAH HURUF BERIKUT:</span>
                            <h3 class="text-danger font-weight-bold mb-0" style="letter-spacing: 6px;">${hurufAcak}</h3>
                        </div>
                        <div class="form-group"><input type="text" id="jawaban_${index}" class="form-control font-weight-bold text-center text-uppercase" placeholder="Ketik kata yang benar..."></div>
                    `;
                } else if (soal.jenis === "Menulis Ringkasan Materi") {
                    htmlContent += `<div class="form-group mt-3"><textarea id="jawaban_${index}" class="form-control" rows="5" placeholder="Tuliskan ringkasan materi Anda..."></textarea></div>`;
                }

                htmlContent += `</div>`;
            });

            htmlContent += `<button type="button" class="btn btn-success btn-custom btn-lg btn-block mt-4 shadow" onclick="kirimJawabanSiswa('${kelas}', '${mapel}', '${jenis}', '${nama}')">✨ Kirim Semua Jawaban</button>`;
            kontainer.innerHTML = htmlContent;
        }

        function kirimJawabanSiswa(kelas, mapel, jenis, nama) {
            let dataSoal = JSON.parse(localStorage.getItem("dataSoal")) || [];
            let soalFilter = dataSoal.filter(s => s.kelas === kelas && s.mapel === mapel && s.jenis === jenis);

            let totalDinilai = 0;
            let jumlahBenar = 0;

            soalFilter.forEach((soal, index) => {
                let diisi = false;
                let benar = false;

                if (soal.jenis === "Pilihan Ganda") {
                    let pilihan = document.querySelector(`input[name="jawaban_${index}"]:checked`);
                    if (pilihan) {
                        diisi = true;
                        if (pilihan.value.trim().toUpperCase() === soal.kunci.trim().toUpperCase()) benar = true;
                    }
                } else if (soal.jenis === "Puzzle") {
                    let inputPuzzle = document.getElementById(`jawaban_${index}`);
                    if (inputPuzzle && inputPuzzle.value.trim() !== "") {
                        diisi = true;
                        if (inputPuzzle.value.trim().toUpperCase() === soal.kunci.trim().toUpperCase()) benar = true;
                    }
                } else {
                    let inputTeks = document.getElementById(`jawaban_${index}`);
                    if (inputTeks && inputTeks.value.trim() !== "") {
                        diisi = true;
                        benar = true;
                    }
                }

                if (diisi) {
                    totalDinilai++;
                    if (benar) jumlahBenar++;
                }
            });

            if (totalDinilai === 0) {
                alert("Harap kerjakan setidaknya satu soal sebelum mengirim jawaban!");
                return;
            }

            let nilaiAkhir = Math.round((jumlahBenar / totalDinilai) * 100);

            let dataNilai = JSON.parse(localStorage.getItem("dataNilai")) || [];
            dataNilai.push({
                tanggal: new Date().toLocaleDateString(),
                nama: nama,
                kelas: kelas,
                mapel: mapel,
                jenis: jenis,
                nilai: nilaiAkhir,
                keterangan: `${jumlahBenar}/${totalDinilai} benar`
            });
            localStorage.setItem("dataNilai", JSON.stringify(dataNilai));

            alert(`🎉 Hore! Jawaban berhasil dikirim, ${nama}!\nNilai Akhir Anda: ${nilaiAkhir}`);
            window.location.reload();
        }
    </script>
</body>
</html>
