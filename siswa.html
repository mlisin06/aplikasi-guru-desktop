<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruang Ujian Ceria - EduAdmin Pro</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body { background-color: #f0f8ff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .header-box { background: linear-gradient(135deg, #ff7e5f, #feb47b); color: white; border-radius: 15px; padding: 25px; margin-bottom: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .card-soal { border-radius: 12px; border: none; box-shadow: 0 3px 10px rgba(0,0,0,0.08); margin-bottom: 20px; }
        .btn-kirim { font-size: 1.2rem; font-weight: bold; border-radius: 50px; padding: 12px 30px; background: #28a745; border: none; }
        .btn-kirim:hover { background: #218838; }
    </style>
</head>
<body>
    <div class="container mt-4 mb-5">
        <!-- Header Ceria -->
        <div class="header-box text-center">
            <h3>🌟 Ruang Ujian & Tugas Siswa 🌟</h3>
            <p class="mb-1">Silakan pilih kelas, nama, dan mata pelajaran dengan teliti sebelum mengerjakan!</p>
            <small>Pencipta Aplikasi: <b>muhlisin06</b></small>
        </div>

        <!-- Form Identitas Siswa -->
        <div class="card p-4 shadow-sm mb-4 border-0 rounded-lg">
            <div class="form-row">
                <div class="form-group col-md-4">
                    <label><b>Pilih Kelas:</b></label>
                    <select id="select-kelas" class="form-control" onchange="filterNamaSiswa()">
                        <option value="">-- Pilih Kelas --</option>
                        <option value="Kelas 1">Kelas 1</option>
                        <option value="Kelas 2">Kelas 2</option>
                        <option value="Kelas 3">Kelas 3</option>
                        <option value="Kelas 4">Kelas 4</option>
                        <option value="Kelas 5">Kelas 5</option>
                        <option value="Kelas 6">Kelas 6</option>
                    </select>
                </div>
                <div class="form-group col-md-4">
                    <label><b>Pilih Nama Siswa:</b></label>
                    <select id="select-siswa" class="form-control">
                        <option value="">-- Pilih Kelas Terlebih Dahulu --</option>
                    </select>
                </div>
                <div class="form-group col-md-4">
                    <label><b>Pilih Mata Pelajaran:</b></label>
                    <select id="select-mapel" class="form-control">
                        <option value="">-- Pilih Mata Pelajaran --</option>
                        <option value="PAIBP">PAIBP</option>
                        <option value="Pendidikan Pancasila">Pendidikan Pancasila</option>
                        <option value="Bahasa Indonesia">Bahasa Indonesia</option>
                        <option value="Matematika">Matematika</option>
                        <option value="IPAS">IPAS</option>
                        <option value="PJOK">PJOK</option>
                        <option value="Bahasa Inggris">Bahasa Inggris</option>
                        <option value="Bahasa Jawa">Bahasa Jawa</option>
                    </select>
                </div>
            </div>
            <button class="btn btn-info btn-block mt-2" onclick="muatSoalUjian()">📂 Muat Soal / Tugas</button>
        </div>

        <!-- Area Soal -->
        <div id="soal-container">
            <div class="text-center text-muted p-5">
                <h5>Silakan lengkapi pilihan Kelas, Nama, dan Mapel di atas, lalu klik "Muat Soal".</h5>
            </div>
        </div>

        <!-- Tombol Kirim -->
        <div id="submit-container" class="text-center mt-4" style="display: none;">
            <button class="btn btn-success btn-kirim shadow" onclick="kirimJawabanSiswa()">🚀 Selesai & Kirim Jawaban</button>
        </div>
    </div>

    <script src="siswa.js"></script>
</body>
</html>
