<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruang Ujian & Tugas Siswa Online</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f8f9fa; }
        .card-custom { border: none; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); background: #ffffff; }
        .header-box { background: linear-gradient(135deg, #007bff 0%, #6610f2 100%); color: white; border-radius: 15px; }
        .form-control { border-radius: 10px; padding: 10px 15px; }
        .btn-custom { border-radius: 10px; padding: 12px 20px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="header-box p-4 mb-4 text-center">
            <h2 class="font-weight-bold mb-2">🎓 Ruang Ujian & Tugas Siswa Online</h2>
            <p class="mb-0 text-white-50">Silakan pilih kelas, nama, dan jenis kuis di bawah ini:</p>
        </div>

        <div class="card card-custom p-4 mb-4">
            <div class="form-row">
                <!-- Pilihan Kelas -->
                <div class="form-group col-md-4">
                    <label class="font-weight-bold small text-muted">Pilih Kelas:</label>
                    <select id="select-kelas" class="form-control">
                        <option value="">-- Pilih Kelas --</option>
                    </select>
                </div>

                <!-- Pilihan Nama Siswa -->
                <div class="form-group col-md-4">
                    <label class="font-weight-bold small text-muted">Pilih Nama Siswa:</label>
                    <select id="select-siswa" class="form-control" disabled>
                        <option value="">-- Pilih Kelas Dulu --</option>
                    </select>
                </div>

                <!-- Pilihan Jenis Kuis / Modul (Default Kosong) -->
                <div class="form-group col-md-4">
                    <label class="font-weight-bold small text-muted">Pilih Jenis Kuis / Modul:</label>
                    <select id="select-modul" class="form-control">
                        <option value="">-- Pilih Jenis Kuis --</option>
                        <option value="Pilihan Ganda">1. Pilihan Ganda</option>
                        <option value="Essay / Uraian">2. Essay / Uraian</option>
                        <option value="Mencocokkan Gambar">3. Mencocokkan Gambar</option>
                        <option value="Puzzle Kata">4. Puzzle Kata</option>
                        <option value="Menulis Ringkasan Materi">5. Menulis Ringkasan Materi</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Wadah Tempat Soal Muncul Dinamis -->
        <div class="card card-custom p-4 mb-4">
            <h4 class="font-weight-bold text-dark mb-3">📝 Lembar Soal Ujian</h4>
            <div id="container-soal">
                <p class="text-center text-muted">Silakan pilih jenis kuis terlebih dahulu untuk memuat soal.</p>
            </div>
        </div>

        <!-- Tombol Kirim Jawaban -->
        <button type="button" onclick="kirimJawabanSiswa()" class="btn btn-primary btn-custom btn-block mb-4 shadow">📤 Kirim Jawaban Ujian</button>

        <div class="text-center">
            <a href="index.html" class="btn btn-light btn-custom border text-muted">&larr; Kembali ke Beranda Utama</a>
        </div>
    </div>

    <!-- Menghubungkan ke file JavaScript Siswa -->
    <script src="siswa.js"></script>
</body>
</html>
