<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduAdmin Pro - Panel Ujian Siswa</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f8f9fa; }
        .card-custom { border: none; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); background: #ffffff; }
        .form-control { border-radius: 10px; padding: 10px 15px; height: calc(1.5em + 1rem + 2px); }
        .btn-custom { border-radius: 10px; padding: 10px 20px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="card card-custom p-4 mb-4 text-center bg-primary text-white shadow-sm">
            <h2 class="font-weight-bold mb-2">🎓 EduAdmin Pro - Panel Siswa</h2>
            <p class="mb-0 text-white-50">Silakan pilih kelas, nama, dan jenis menu yang ingin diakses.</p>
        </div>

        <!-- Form Identitas & Pilihan Menu -->
        <div class="card card-custom p-4 mb-4">
            <div class="form-row">
                <div class="form-group col-md-4">
                    <label class="small font-weight-bold">Pilih Kelas:</label>
                    <select id="kelas-siswa" class="form-control" onchange="muatSiswaBerdasarkanKelas()">
                        <option value="">-- Pilih Kelas --</option>
                        <option value="Kelas 1">Kelas 1</option>
                        <option value="Kelas 2">Kelas 2</option>
                        <option value="Kelas 3">Kelas 3</option>
                        <option value="Kelas 4">Kelas 4</option>
                        <option value="Kelas 5">Kelas 5</option>
                        <option value="Kelas 6">Kelas 6</option>
                    </select>
                </div>
                <div class="form-group col-md-4">
                    <label class="small font-weight-bold">Pilih Nama Siswa:</label>
                    <select id="nama-siswa" class="form-control">
                        <option value="">-- Pilih Nama --</option>
                    </select>
                </div>
                <div class="form-group col-md-4">
                    <label class="small font-weight-bold">Pilih Jenis Kuis / Modul:</label>
                    <select id="pilih-jenis" class="form-control" onchange="cekPilihanMenu()">
                        <option value="soal">📝 Soal PG & Essay</option>
                        <option value="materi">📖 Baca Materi & Modul PDF</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Container Soal (PG & Essay) -->
        <div id="container-soal" class="card card-custom p-4 mb-4">
            <h4 class="text-primary font-weight-bold mb-3">📝 Lembar Ujian / Kuis</h4>
            <div id="area-soal" class="text-center text-muted py-4">
                Silakan pilih kelas, nama siswa, dan pastikan soal tersedia.
            </div>
            <button type="button" class="btn btn-success btn-custom btn-block mt-3 shadow-sm" onclick="kirimJawaban()">
                🚀 Selesai & Kirim Jawaban
            </button>
        </div>

        <!-- Container Materi PDF (Terfilter Otomatis) -->
        <div id="container-materi" class="card card-custom p-4 mb-4" style="display: none;">
            <h4 class="text-success font-weight-bold mb-3">📖 Daftar Materi & Bahan Bacaan Sesuai Kelas</h4>
            <div class="table-responsive">
                <table class="table table-bordered table-striped">
                    <thead class="thead-dark">
                        <tr>
                            <th width="5%">No</th>
                            <th width="25%">Mata Pelajaran</th>
                            <th width="50%">Judul Materi</th>
                            <th width="20%">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tabel-materi-siswa-body">
                        <tr><td colspan="4" class="text-center text-muted py-3">Memuat materi...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="text-center">
            <a href="index.html" class="btn btn-light btn-custom border text-muted shadow-sm">&larr; Kembali ke Beranda</a>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyI-MoR-4xGjrxrbgn-rKjqLiHzrrQQ0tJwlFGBSExRl9BBE9pVPTGzvobYMoMkrei0/exec";
        let semuaSiswa = [];

        document.addEventListener("DOMContentLoaded", function() {
            ambilDataSiswaServer();
        });

        async function ambilDataSiswaServer() {
            try {
                let response = await fetch(SCRIPT_URL + "?action=getSiswa");
                semuaSiswa = await response.json();
            } catch (e) {
                console.error("Gagal memuat data siswa:", e);
            }
        }

        function muatSiswaBerdasarkanKelas() {
            let kelasDipilih = document.getElementById("kelas-siswa").value;
            let dropdownNama = document.getElementById("nama-siswa");
            dropdownNama.innerHTML = `<option value="">-- Pilih Nama --</option>`;

            let filterSiswa = semuaSiswa.filter(s => s.kelas === kelasDipilih);
            filterSiswa.forEach(s => {
                let opt = document.createElement("option");
                opt.value = s.nama || s.Nama;
                opt.textContent = s.nama || s.Nama;
                dropdownNama.appendChild(opt);
            });

            // Jika posisi menu sedang di tab materi, perbarui juga daftarnya
            let jenis = document.getElementById("pilih-jenis").value;
            if (jenis === "materi") {
                muatMateriSiswa();
            }
        }

        function cekPilihanMenu() {
            let jenis = document.getElementById("pilih-jenis").value;
            let containerSoal = document.getElementById("container-soal");
            let containerMateri = document.getElementById("container-materi");

            if (jenis === "materi") {
                containerSoal.style.display = "none";
                containerMateri.style.display = "block";
                muatMateriSiswa();
            } else {
                containerSoal.style.display = "block";
                containerMateri.style.display = "none";
            }
        }

        async function muatMateriSiswa() {
            let kelasSiswa = document.getElementById("kelas-siswa").value;
            let tbody = document.getElementById("tabel-materi-siswa-body");
            
            if (!kelasSiswa) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center text-warning py-3">Harap pilih Kelas terlebih dahulu di atas!</td></tr>`;
                return;
            }

            tbody.innerHTML = `<tr><td colspan="4" class="text-center text-muted py-3">Memuat materi...</td></tr>`;

            try {
                let response = await fetch(SCRIPT_URL + "?action=getMateri");
                let dataMateri = await response.json();
                tbody.innerHTML = "";

                // Filter materi berdasarkan kelas yang dipilih siswa
                let dataFiltered = dataMateri.filter(item => item.kelas === kelasSiswa);

                if (dataFiltered.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" class="text-center text-muted py-3">Belum ada materi untuk ${kelasSiswa}.</td></tr>`;
                    return;
                }

                dataFiltered.forEach((materi, index) => {
                    let tr = document.createElement("tr");
                    tr.innerHTML = `
                        <td>${index + 1}</td>
                        <td><span class="badge badge-secondary">${materi.mapel}</span></td>
                        <td class="font-weight-bold text-left">${materi.judul}</td>
                        <td>
                            <a href="${materi.filedata || materi.fileData}" target="_blank" class="btn btn-sm btn-success font-weight-bold px-3">👀 Buka Materi</a>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (e) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center text-danger py-3">Gagal memuat materi dari server.</td></tr>`;
            }
        }

        function kirimJawaban() {
            alert("Fitur pengiriman kuis berjalan normal.");
        }
    </script>
</body>
</html>
