<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduAdmin Pro - Panel Ujian Siswa</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body { 
            background: linear-gradient(135deg, #f0f8ff, #e6f2ff); 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            min-height: 100vh;
            padding: 30px 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .student-card { 
            background: white;
            border-radius: 20px; 
            padding: 30px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            max-width: 700px;
            width: 100%;
        }
        .header-logo {
            height: 60px; 
            background-color: white; 
            padding: 5px; 
            border-radius: 12px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin-bottom: 15px;
        }
        .btn-custom {
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            padding: 12px 20px;
            transition: all 0.3s ease;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="student-card mx-auto">
            <div class="text-center">
                <img src="assets/images/tutwuri.png" alt="Logo Tut Wuri Handayani" class="header-logo">
                <h2 class="font-weight-bold text-dark mb-1">Ruang Ujian & Tugas Siswa Online</h2>
                <p class="text-muted mb-4">Silakan pilih nama Anda dan jenis kuis di bawah ini:</p>
            </div>

            <!-- Form Pengerjaan Siswa -->
            <div class="form-group">
                <label class="font-weight-bold">Pilih Nama Siswa:</label>
                <select id="select-siswa" class="form-control">
                    <option value="">-- Memuat Data Siswa --</option>
                </select>
            </div>

            <div class="form-group">
                <label class="font-weight-bold">Pilih Jenis Kuis / Modul:</label>
                <select id="select-modul" class="form-control">
                    <option value="pg">1. Soal PG & Essay</option>
                    <option value="gambar">2. Mencocokkan Gambar</option>
                    <option value="kata">3. Mencocokkan Kata</option>
                    <option value="rangkum">4. Merangkum Materi</option>
                </select>
            </div>

            <hr class="my-4">

            <!-- Container Soal / Kuis -->
            <div id="container-soal" class="mb-4" style="background: #f8fafc; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0;">
                <p class="text-center text-muted mb-0">Memuat kuis...</p>
            </div>

            <div class="text-center">
                <button onclick="kirimJawabanSiswa()" class="btn btn-success btn-custom btn-block shadow-sm">
                    🚀 Selesai & Kirim Jawaban
                </button>
                <a href="index.html" class="btn btn-outline-secondary btn-sm mt-3">← Kembali ke Beranda Utama</a>
            </div>
        </div>
    </div>

    <script src="siswa.js"></script>
</body>
</html>
