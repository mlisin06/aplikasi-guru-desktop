<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beranda - Ruang Ujian & Tugas Sekolah</title>

    <!-- Favicon & Metadata WhatsApp -->
    <link rel="icon" type="image/jpeg" href="https://i.ibb.co.com/tw4YXz73/gemini-svg-1.jpg">
    <meta property="og:title" content="EduAdmin Pro - Dashboard Guru">
    <meta property="og:description" content="Panel kontrol guru untuk mengelola soal, data siswa, administrasi, dan rekap nilai secara real-time.">
    <meta property="og:image" content="https://i.ibb.co.com/tw4YXz73/gemini-svg-1.jpg">
    <meta property="og:type" content="website">
    
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body { 
            background: linear-gradient(135deg, #f0f8ff, #e6f2ff); 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .welcome-card { 
            background: white;
            border-radius: 20px; 
            padding: 40px 30px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            max-width: 550px;
            width: 100%;
            text-align: center;
        }
        .header-logo {
            height: 70px; 
            background-color: white; 
            padding: 5px; 
            border-radius: 12px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .btn-menu {
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            padding: 14px 20px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }
        .btn-siswa {
            background: linear-gradient(135deg, #17a2b8, #138496);
            border: none;
            color: white;
        }
        .btn-siswa:hover {
            background: linear-gradient(135deg, #138496, #117a8b);
            color: white;
            transform: translateY(-2px);
        }
        .btn-guru {
            background: linear-gradient(135deg, #ff7e5f, #feb47b);
            border: none;
            color: white;
        }
        .btn-guru:hover {
            background: linear-gradient(135deg, #e86b4c, #e59f67);
            color: white;
            transform: translateY(-2px);
        }
        .banner-demo { 
            background: #fff3cd; 
            border: 1px solid #ffeeba; 
            border-radius: 12px; 
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="welcome-card mx-auto">
            <!-- Banner Mode Demo (Hanya muncul jika diakses dengan ?demo=true) -->
            <div id="banner-demo-mode" class="banner-demo p-2 mb-3 text-dark shadow-sm" style="display: none;">
                <span class="font-weight-bold text-warning">🎮 Mode Demo Aktif</span>
            </div>

            <!-- Logo Tut Wuri -->
            <img src="assets/images/tutwuri.png" alt="Logo Tut Wuri Handayani" class="header-logo">
            
            <h2 class="font-weight-bold text-dark mb-2">Portal Ujian & Tugas</h2>
            <p class="text-muted mb-4">Silakan pilih menu di bawah ini sesuai dengan peran Anda:</p>

            <!-- Tombol Navigasi ke Halaman Siswa atau Guru -->
            <div class="d-flex flex-column">
                <a href="siswa.html" id="btn-link-siswa" class="btn btn-menu btn-siswa shadow-sm">
                    🎓 Masuk ke Ruang Siswa (Mengerjakan Ujian)
                </a>
                <a href="guru.html" id="btn-link-guru" class="btn btn-menu btn-guru shadow-sm">
                    👩‍🏫 Masuk ke Panel Guru (Kelola Soal & Nilai)
                </a>
            </div>

            <hr class="my-4">
            <small class="text-muted">Pencipta Aplikasi: <b>muhlisin06</b></small>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Deteksi otomatis jika dibuka via link blog dengan parameter ?demo=true
        document.addEventListener("DOMContentLoaded", function() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('demo') === 'true' || window.location.href.includes('demo=true')) {
                document.getElementById('banner-demo-mode').style.display = 'block';
                // Teruskan parameter demo ke tombol siswa & guru
                document.getElementById('btn-link-siswa').href = 'siswa.html?demo=true';
                document.getElementById('btn-link-guru').href = 'guru.html?demo=true';
            }
        });
    </script>
</body>
</html>
