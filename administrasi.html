<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrasi & Materi Pembelajaran - Portal Pendidikan</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f8f9fa; }
        .card-custom { border: none; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); background: #ffffff; }
        .form-control { border-radius: 10px; padding: 10px 15px; height: calc(1.5em + 1rem + 2px); }
        .btn-custom { border-radius: 10px; padding: 10px 20px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="card card-custom p-4 mb-4 text-center bg-info text-white shadow-sm">
            <h2 class="font-weight-bold mb-2">📚 Administrasi & Materi PDF Online</h2>
            <p class="mb-0 text-white-50">Upload modul/materi PDF via Google Drive agar bisa dibaca langsung oleh siswa.</p>
        </div>

        <!-- Panel Guru Upload Link PDF -->
        <div class="card card-custom p-4 mb-4 border-top border-primary" style="border-top-width: 5px !important;">
            <h4 class="text-primary font-weight-bold mb-3">👨‍🏫 Simpan Materi & Link PDF</h4>
            <div class="form-row">
                <div class="form-group col-md-3">
                    <label class="small font-weight-bold">Kelas</label>
                    <select id="upload-kelas" class="form-control">
                        <option value="Kelas 1">Kelas 1</option>
                        <option value="Kelas 2">Kelas 2</option>
                        <option value="Kelas 3">Kelas 3</option>
                        <option value="Kelas 4">Kelas 4</option>
                        <option value="Kelas 5">Kelas 5</option>
                        <option value="Kelas 6">Kelas 6</option>
                    </select>
                </div>
                <div class="form-group col-md-3">
                    <label class="small font-weight-bold">Mata Pelajaran</label>
                    <select id="upload-mapel" class="form-control">
                        <option value="PAIBP">PAIBP</option>
                        <option value="Pendidikan Pancasila">Pendidikan Pancasila</option>
                        <option value="Bahasa Indonesia">Bahasa Indonesia</option>
                        <option value="Matematika">Matematika</option>
                        <option value="IPAS">IPAS</option>
                        <option value="PJOK">PJOK</option>
                        <option value="Bahasa Inggris">Bahasa Inggris</option>
                        <option value="Bahasa Jawa">Bahasa Jawa</option>
                    </select>
                </div>
                <div class="form-group col-md-3">
                    <label class="small font-weight-bold">Judul Materi / Bab</label>
                    <input type="text" id="upload-judul" class="form-control" placeholder="Contoh: Modul Bab 1 Pecahan">
                </div>
                <div class="form-group col-md-3">
                    <label class="small font-weight-bold">Link Google Drive PDF</label>
                    <input type="text" id="upload-link" class="form-control" placeholder="Paste Link Google Drive di sini">
                </div>
            </div>
            <button type="button" class="btn btn-primary btn-custom btn-block mt-2 shadow-sm" onclick="simpanMateriPDFKeServer()">
                📤 Simpan Materi ke Cloud
            </button>
        </div>

        <!-- Daftar Materi Siswa -->
        <div class="card card-custom p-4 mb-4">
            <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap">
                <h4 class="text-success font-weight-bold mb-0">📖 Daftar Materi & Bahan Bacaan Online</h4>
                <div class="form-inline mt-2 mt-md-0">
                    <label class="small font-weight-bold mr-2">Filter Kelas:</label>
                    <select id="filter-kelas-materi" class="form-control form-control-sm" onchange="tampilkanDaftarMateri()">
                        <option value="">-- Semua Kelas --</option>
                        <option value="Kelas 1">Kelas 1</option>
                        <option value="Kelas 2">Kelas 2</option>
                        <option value="Kelas 3">Kelas 3</option>
                        <option value="Kelas 4">Kelas 4</option>
                        <option value="Kelas 5">Kelas 5</option>
                        <option value="Kelas 6">Kelas 6</option>
                    </select>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-bordered table-striped">
                    <thead class="thead-dark">
                        <tr>
                            <th width="5%">No</th>
                            <th width="15%">Kelas</th>
                            <th width="20%">Mata Pelajaran</th>
                            <th width="40%">Judul Materi</th>
                            <th width="20%">Aksi Preview</th>
                        </tr>
                    </thead>
                    <tbody id="tabel-materi-body">
                        <tr><td colspan="5" class="text-center text-muted py-4">Memuat data materi dari server...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="text-center">
            <a href="guru.html" class="btn btn-light btn-custom border text-muted shadow-sm">&larr; Kembali ke Dashboard Guru</a>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyI-MoR-4xGjrxrbgn-rKjqLiHzrrQQ0tJwlFGBSExRl9BBE9pVPTGzvobYMoMkrei0/exec";

        document.addEventListener("DOMContentLoaded", function() {
            tampilkanDaftarMateri();
        });

        function simpanMateriPDFKeServer() {
            let kelas = document.getElementById("upload-kelas").value;
            let mapel = document.getElementById("upload-mapel").value;
            let judul = document.getElementById("upload-judul").value.trim();
            let linkDrive = document.getElementById("upload-link").value.trim();

            if (!judul || !linkDrive) {
                alert("Harap isi Judul Materi dan Link Google Drive terlebih dahulu!");
                return;
            }

            let dataKirim = {
                action: "simpanMateri",
                tanggal: new Date().toLocaleDateString(),
                kelas: kelas,
                mapel: mapel,
                judul: judul,
                fileData: linkDrive,
                fileName: "Dokumen PDF Drive"
            };

            let btn = event.target;
            btn.disabled = true;
            btn.innerText = "Menyimpan ke Server...";

            let params = new URLSearchParams(dataKirim);

            fetch(SCRIPT_URL + "?" + params.toString(), { mode: "no-cors" })
                .then(() => {
                    alert("🎉 Materi berhasil disimpan ke sistem!");
                    document.getElementById("upload-judul").value = "";
                    document.getElementById("upload-link").value = "";
                    btn.disabled = false;
                    btn.innerText = "📤 Simpan Materi ke Cloud";
                    setTimeout(tampilkanDaftarMateri, 1500);
                })
                .catch(err => {
                    alert("Gagal menyimpan: " + err);
                    btn.disabled = false;
                    btn.innerText = "📤 Simpan Materi ke Cloud";
                });
        }

        async function tampilkanDaftarMateri() {
            let tbody = document.getElementById("tabel-materi-body");
            let filterKelas = document.getElementById("filter-kelas-materi").value;

            try {
                let response = await fetch(SCRIPT_URL + "?action=getMateri");
                let dataMateri = await response.json();
                tbody.innerHTML = "";

                let dataFiltered = dataMateri.filter(item => {
                    return filterKelas ? item.kelas === filterKelas : true;
                });

                if (dataFiltered.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted py-4">Belum ada materi di server.</td></tr>`;
                    return;
                }

                dataFiltered.forEach((materi, index) => {
                    let tr = document.createElement("tr");
                    tr.innerHTML = `
                        <td>${index + 1}</td>
                        <td><b>${materi.kelas}</b></td>
                        <td><span class="badge badge-secondary">${materi.mapel}</span></td>
                        <td class="font-weight-bold text-left">${materi.judul}</td>
                        <td>
                            <a href="${materi.filedata || materi.fileData}" target="_blank" class="btn btn-sm btn-success font-weight-bold px-3">👀 Buka Materi</a>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (e) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center text-danger py-4">Gagal memuat data dari server.</td></tr>`;
            }
        }
    </script>
</body>
</html>
