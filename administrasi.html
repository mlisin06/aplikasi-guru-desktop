<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pusat Administrasi Guru</title>
    <!-- CSS Bootstrap dll -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-4">
        <!-- Header & Konten Anda -->
        <div class="card p-4">
            <h3>Pusat Administrasi Guru</h3>
            <!-- Tombol Kelola Perangkat -->
            <button id="btn-kelola-perangkat" class="btn btn-success mt-3">Kelola Perangkat</button>
        </div>

        <!-- Tabel Tempat Menampilkan Data Kurikulum -->
        <div class="card p-4 mt-3">
            <h5>Daftar Kurikulum & Perangkat</h5>
            <table class="table table-bordered mt-2">
                <thead>
                    <tr>
                        <th>Kelas</th>
                        <th>Mapel</th>
                        <th>Fase</th>
                        <th>Capaian Pembelajaran (CP)</th>
                    </tr>
                </thead>
                <tbody id="tabel-kurikulum-body">
                    <tr>
                        <td colspan="4" class="text-center text-muted">Klik "Kelola Perangkat" untuk memuat data dari Google Sheets.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- TEMPAT MENARUH KODE JAVASCRIPT -->
    <script>
        // Ganti URL di bawah ini dengan URL Web App Google Apps Script Anda yang terbaru!
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx5nkmrvSUusyiJ0qIYQYnXxroIWMQdHYWbKbTpM6X6VbQ1eyxZ-9EDNANANKeT6a2_YQ/exec";

        document.getElementById('btn-kelola-perangkat').addEventListener('click', function() {
            muatDataKurikulum();
        });

        function muatDataKurikulum() {
            const url = SCRIPT_URL + "?action=getKurikulum";
            
            // Tampilkan pesan loading
            const tbody = document.getElementById('tabel-kurikulum-body');
            tbody.innerHTML = `<tr><td colspan="4" class="text-center text-info">Memuat data dari Google Sheets...</td></tr>`;

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    console.log("Data Kurikulum:", data);
                    tbody.innerHTML = ""; // Kosongkan tabel

                    if (data.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="4" class="text-center text-danger">Tidak ada data ditemukan di tab Kurikulum.</td></tr>`;
                        return;
                    }

                    // Masukkan data ke dalam tabel secara otomatis
                    data.forEach(item => {
                        let row = `<tr>
                            <td>${item.kelas}</td>
                            <td>${item.mapel}</td>
                            <td>${item.fase}</td>
                            <td>${item.cp}</td>
                        </tr>`;
                        tbody.innerHTML += row;
                    });
                })
                .catch(error => {
                    console.error("Terjadi kesalahan:", error);
                    tbody.innerHTML = `<tr><td colspan="4" class="text-center text-danger">Gagal memuat data dari Google Sheets. Periksa URL Apps Script Anda.</td></tr>`;
                });
        }
    </script>
</body>
</html>
