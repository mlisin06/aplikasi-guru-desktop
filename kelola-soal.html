<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Soal & Tugas - Panel Guru</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5 mb-5">
        <div class="card shadow p-4">
            <h3 class="text-info mb-3">📝 Input & Kelola Soal Ujian</h3>
            <p class="text-muted">Masukkan soal pilihan ganda beserta mata pelajaran dan jenis kuisnya di sini.</p>
            
            <!-- Diubah menggunakan div biasa agar tidak bergantung pada form submit -->
            <div id="form-tambah-soal" class="mb-4">
                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label>Mata Pelajaran</label>
                        <input type="text" id="input-mapel" class="form-control" placeholder="Contoh: Matematika">
                    </div>
                    <div class="form-group col-md-6">
                        <label>Jenis Kuis</label>
                        <input type="text" id="input-jenis" class="form-control" placeholder="Contoh: Ujian Harian">
                    </div>
                </div>

                <div class="form-group">
                    <label>Pertanyaan Soal</label>
                    <textarea id="input-pertanyaan" class="form-control" rows="3" placeholder="Tulis teks pertanyaan di sini..."></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label>Opsi A</label>
                        <input type="text" id="input-opsiA" class="form-control" placeholder="Pilihan A">
                    </div>
                    <div class="form-group col-md-6">
                        <label>Opsi B</label>
                        <input type="text" id="input-opsiB" class="form-control" placeholder="Pilihan B">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label>Opsi C</label>
                        <input type="text" id="input-opsiC" class="form-control" placeholder="Pilihan C">
                    </div>
                    <div class="form-group col-md-6">
                        <label>Opsi D</label>
                        <input type="text" id="input-opsiD" class="form-control" placeholder="Pilihan D">
                    </div>
                </div>

                <!-- Tombol menggunakan onclick langsung untuk menghindari error form -->
                <button type="button" onclick="simpanSoalBaru()" class="btn btn-info btn-block font-weight-bold text-white">Simpan Soal</button>
            </div>

            <hr>

            <h5 class="mt-4">Daftar Soal yang Tersimpan</h5>
            <div class="table-responsive">
                <table class="table table-bordered table-striped mt-2">
                    <thead class="thead-dark">
                        <tr>
                            <th>No</th>
                            <th>Mapel / Jenis</th>
                            <th>Pertanyaan</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tabel-soal-body">
                        <!-- Data soal akan dimuat otomatis lewat JavaScript -->
                    </tbody>
                </table>
            </div>

            <div class="mt-3">
                <a href="guru.html" class="btn btn-secondary">&larr; Kembali ke Dashboard Guru</a>
            </div>
        </div>
    </div>

    <script>
        // Jalankan saat halaman siap
        document.addEventListener("DOMContentLoaded", function() {
            tampilkanTabelSoal();
        });

        function simpanSoalBaru() {
            let mapel = document.getElementById("input-mapel").value.trim();
            let jenis = document.getElementById("input-jenis").value.trim();
            let pertanyaan = document.getElementById("input-pertanyaan").value.trim();
            let opsiA = document.getElementById("input-opsiA").value.trim();
            let opsiB = document.getElementById("input-opsiB").value.trim();
            let opsiC = document.getElementById("input-opsiC").value.trim();
            let opsiD = document.getElementById("input-opsiD").value.trim();

            if (!mapel || !jenis || !pertanyaan || !opsiA || !opsiB) {
                alert("Harap isi minimal Mata Pelajaran, Jenis Kuis, Pertanyaan, dan Pilihan A & B!");
                return;
            }

            let dataSoal = JSON.parse(localStorage.getItem("dataSoal")) || [];
            
            dataSoal.push({ mapel, jenis, pertanyaan, opsiA, opsiB, opsiC, opsiD });
            localStorage.setItem("dataSoal", JSON.stringify(dataSoal));

            alert("Soal berhasil disimpan ke memori lokal!");
            
            // Kosongkan form
            document.getElementById("input-mapel").value = "";
            document.getElementById("input-jenis").value = "";
            document.getElementById("input-pertanyaan").value = "";
            document.getElementById("input-opsiA").value = "";
            document.getElementById("input-opsiB").value = "";
            document.getElementById("input-opsiC").value = "";
            document.getElementById("input-opsiD").value = "";

            tampilkanTabelSoal();
        }

        function tampilkanTabelSoal() {
            let dataSoal = JSON.parse(localStorage.getItem("dataSoal")) || [];
            let tbody = document.getElementById("tabel-soal-body");
            if (!tbody) return;

            tbody.innerHTML = "";

            if (dataSoal.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center text-muted">Belum ada soal tersedia.</td></tr>`;
                return;
            }

            dataSoal.forEach((soal, index) => {
                let tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td><b>${soal.mapel}</b><br><small class="text-muted">${soal.jenis}</small></td>
                    <td>${soal.pertanyaan}</td>
                    <td><button class="btn btn-danger btn-sm" onclick="hapusSoal(${index})">Hapus</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function hapusSoal(index) {
            if (confirm("Yakin ingin menghapus soal ini?")) {
                let dataSoal = JSON.parse(localStorage.getItem("dataSoal")) || [];
                dataSoal.splice(index, 1);
                localStorage.setItem("dataSoal", JSON.stringify(dataSoal));
                tampilkanTabelSoal();
            }
        }
    </script>
</body>
</html>
