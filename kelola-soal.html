<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Soal & Kuis - Portal Pendidikan</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f8f9fa; }
        .card-custom { border: none; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); background: #ffffff; }
        .form-control { border-radius: 10px; padding: 10px 15px; height: calc(1.5em + 1rem + 2px); }
        textarea.form-control { height: auto; }
        .btn-custom { border-radius: 10px; padding: 10px 20px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="card card-custom p-4 mb-4 text-center bg-primary text-white shadow-sm">
            <h2 class="font-weight-bold mb-2">📝 Kelola Soal & Kuis Ujian</h2>
            <p class="mb-0 text-white-50">Input dan atur bank soal atau tugas siswa secara online.</p>
        </div>

        <!-- Form Input Soal Dinamis -->
        <div class="card card-custom p-4 mb-4">
            <h4 class="text-primary font-weight-bold mb-3">➕ Tambah Soal / Tugas Baru</h4>
            <div class="form-row">
                <div class="form-group col-md-4">
                    <label class="small font-weight-bold">Kelas</label>
                    <select id="input-kelas" class="form-control">
                        <option value="Kelas 1">Kelas 1</option>
                        <option value="Kelas 2">Kelas 2</option>
                        <option value="Kelas 3">Kelas 3</option>
                        <option value="Kelas 4">Kelas 4</option>
                        <option value="Kelas 5">Kelas 5</option>
                        <option value="Kelas 6" selected>Kelas 6</option>
                    </select>
                </div>
                <div class="form-group col-md-4">
                    <label class="small font-weight-bold">Mata Pelajaran</label>
                    <select id="input-mapel" class="form-control">
                        <option value="PAIBP">PAIBP</option>
                        <option value="Pendidikan Pancasila">Pendidikan Pancasila</option>
                        <option value="Bahasa Indonesia">Bahasa Indonesia</option>
                        <option value="Matematika">Matematika</option>
                        <option value="IPAS">IPAS</option>
                        <option value="PJOK">PJOK</option>
                        <option value="Bahasa Inggris">Bahasa Inggris</option>
                        <option value="Bahasa Jawa">Bahasa Jawa</option>
                    </select>
                </div>
                <div class="form-group col-md-4">
                    <label class="small font-weight-bold">Jenis Soal / Tugas</label>
                    <select id="input-jenis" class="form-control" onchange="sesuaikanFormInput()">
                        <option value="Pilihan Ganda">Pilihan Ganda</option>
                        <option value="Puzzle Kata">Puzzle Kata</option>
                        <option value="Essay">Essay</option>
                        <option value="Merangkum Materi">Merangkum Materi</option>
                    </select>
                </div>
            </div>

            <!-- Area Label Pertanyaan Dinamis -->
            <div class="form-group">
                <label id="label-pertanyaan" class="small font-weight-bold">Pertanyaan / Soal</label>
                <textarea id="input-soal" class="form-control" rows="3" placeholder="Tuliskan pertanyaan di sini..."></textarea>
            </div>

            <!-- CONTAINER KHUSUS PILIHAN GANDA (Opsi A-D & Kunci) -->
            <div id="container-pg">
                <div class="form-row">
                    <div class="form-group col-md-3">
                        <label class="small font-weight-bold">Opsi A</label>
                        <input type="text" id="input-opsia" class="form-control" placeholder="Pilihan A">
                    </div>
                    <div class="form-group col-md-3">
                        <label class="small font-weight-bold">Opsi B</label>
                        <input type="text" id="input-opsib" class="form-control" placeholder="Pilihan B">
                    </div>
                    <div class="form-group col-md-3">
                        <label class="small font-weight-bold">Opsi C</label>
                        <input type="text" id="input-opsic" class="form-control" placeholder="Pilihan C">
                    </div>
                    <div class="form-group col-md-3">
                        <label class="small font-weight-bold">Opsi D</label>
                        <input type="text" id="input-opsid" class="form-control" placeholder="Pilihan D">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label class="small font-weight-bold">Kunci Jawaban (Contoh: A)</label>
                        <input type="text" id="input-kunci" class="form-control" placeholder="Kunci jawaban benar">
                    </div>
                    <div class="form-group col-md-6">
                        <label class="small font-weight-bold">Link Gambar (Opsional)</label>
                        <input type="text" id="input-gambar" class="form-control" placeholder="URL gambar jika ada">
                    </div>
                </div>
            </div>

            <button type="button" class="btn btn-success btn-custom btn-block mt-3 shadow-sm" onclick="simpanSoalKeServer()">
                💾 Simpan Soal ke Google Sheets
            </button>
        </div>

        <!-- Daftar Soal Tersimpan dengan Filter -->
        <div class="card card-custom p-4 mb-4">
            <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap">
                <h4 class="text-secondary font-weight-bold mb-2">📊 Daftar Soal di Cloud</h4>
                <button class="btn btn-outline-primary btn-sm font-weight-bold" onclick="tampilkanDaftarSoal()">🔄 Refresh Data</button>
            </div>

            <div class="form-row mb-3 bg-light p-3 rounded">
                <div class="form-group col-md-4 mb-2">
                    <label class="small font-weight-bold">Filter Kelas:</label>
                    <select id="filter-kelas" class="form-control form-control-sm" onchange="tampilkanDaftarSoal()">
                        <option value="">-- Semua Kelas --</option>
                        <option value="Kelas 1">Kelas 1</option>
                        <option value="Kelas 2">Kelas 2</option>
                        <option value="Kelas 3">Kelas 3</option>
                        <option value="Kelas 4">Kelas 4</option>
                        <option value="Kelas 5">Kelas 5</option>
                        <option value="Kelas 6">Kelas 6</option>
                    </select>
                </div>
                <div class="form-group col-md-4 mb-2">
                    <label class="small font-weight-bold">Filter Mata Pelajaran:</label>
                    <select id="filter-mapel" class="form-control form-control-sm" onchange="tampilkanDaftarSoal()">
                        <option value="">-- Semua Mapel --</option>
                        <option value="PAIBP">PAIBP</option>
                        <option value="Pendidikan Pancasila">Pendidikan Pancasila</option>
                        <option value="Bahasa Indonesia">Bahasa Indonesia</option>
                        <option value="Matematika">Matematika</option>
                        <option value="IPAS">IPAS</option>
                        <option value="PJOK">PJOK</option>
                        <option value="Bahasa Inggris">Bahasa Inggris</option>
                        <option value="Bahasa Jawa">Bahasa Jawa</option>
                    </select>
                </div>
                <div class="form-group col-md-4 mb-2">
                    <label class="small font-weight-bold">Filter Jenis Kuis:</label>
                    <select id="filter-jenis" class="form-control form-control-sm" onchange="tampilkanDaftarSoal()">
                        <option value="">-- Semua Jenis Kuis --</option>
                        <option value="Pilihan Ganda">Pilihan Ganda</option>
                        <option value="Puzzle Kata">Puzzle Kata</option>
                        <option value="Essay">Essay</option>
                        <option value="Merangkum Materi">Merangkum Materi</option>
                    </select>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-bordered table-striped">
                    <thead class="thead-dark">
                        <tr>
                            <th width="5%">No</th>
                            <th width="15%">Kelas</th>
                            <th width="15%">Mapel</th>
                            <th width="15%">Jenis</th>
                            <th width="40%">Pertanyaan / Tugas</th>
                            <th width="10%">Status</th>
                        </tr>
                    </thead>
                    <tbody id="tabel-soal-body">
                        <tr><td colspan="6" class="text-center text-muted py-4">Memuat data soal...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="text-center">
            <a href="guru.html" class="btn btn-light btn-custom border text-muted shadow-sm">&larr; Kembali ke Dashboard Guru</a>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyI-MoR-4xGjrxrbgn-rKjqLiHzrrQQ0tJwlFGBSExRl9BBE9pVPTGzvobYMoMkrei0/exec";

        document.addEventListener("DOMContentLoaded", function() {
            tampilkanDaftarSoal();
            sesuaikanFormInput();
        });

        function sesuaikanFormInput() {
            let jenis = document.getElementById("input-jenis").value;
            let labelPertanyaan = document.getElementById("label-pertanyaan");
            let inputSoal = document.getElementById("input-soal");
            let containerPG = document.getElementById("container-pg");

            if (jenis === "Puzzle Kata") {
                labelPertanyaan.innerHTML = "🔤 Kalimat / Kata Benar (Akan diacak otomatis untuk siswa):";
                inputSoal.placeholder = "Contoh: Pancasila adalah dasar negara Indonesia";
                containerPG.style.display = "none";
            } else if (jenis === "Merangkum Materi") {
                labelPertanyaan.innerHTML = "✍️ Judul / Instruksi Tugas Ringkasan (Siswa wajib merangkum min. 300 karakter):";
                inputSoal.placeholder = "Contoh: Buatlah ringkasan mengenai materi Bab 1 tentang ekosistem...";
                containerPG.style.display = "none";
            } else if (jenis === "Essay") {
                labelPertanyaan.innerHTML = "📝 Pertanyaan Essay / Uraian:";
                inputSoal.placeholder = "Tuliskan pertanyaan uraian di sini...";
                containerPG.style.display = "none";
            } else {
                // Pilihan Ganda
                labelPertanyaan.innerHTML = "❓ Pertanyaan / Soal Pilihan Ganda:";
                inputSoal.placeholder = "Tuliskan pertanyaan soal di sini...";
                containerPG.style.display = "block";
            }
        }

        function simpanSoalKeServer() {
            let kelas = document.getElementById("input-kelas").value;
            let mapel = document.getElementById("input-mapel").value;
            let jenis = document.getElementById("input-jenis").value;
            let soal = document.getElementById("input-soal").value.trim();
            
            let opsiA = jenis === "Pilihan Ganda" ? document.getElementById("input-opsia").value.trim() : "";
            let opsiB = jenis === "Pilihan Ganda" ? document.getElementById("input-opsib").value.trim() : "";
            let opsiC = jenis === "Pilihan Ganda" ? document.getElementById("input-opsic").value.trim() : "";
            let opsiD = jenis === "Pilihan Ganda" ? document.getElementById("input-opsid").value.trim() : "";
            let kunci = jenis === "Pilihan Ganda" ? document.getElementById("input-kunci").value.trim() : "";
            let gambar = jenis === "Pilihan Ganda" ? document.getElementById("input-gambar").value.trim() : "";

            if (!soal) {
                alert("Pertanyaan / tugas tidak boleh kosong!");
                return;
            }

            // Parameter ini dipetakan pas dengan urutan appendRow di Code.gs:
            let dataKirim = {
                action: "simpanSoal",
                tanggal: new Date().toLocaleDateString("id-ID"),
                kelas: kelas,
                mapel: mapel,
                jenis: jenis,
                pertanyaan: soal,
                opsiA: opsiA,
                opsiB: opsiB,
                opsiC: opsiC,
                opsiD: opsiD,
                kunci: kunci,
                gambar: gambar
            };

            let btn = event.target;
            btn.disabled = true;
            btn.innerText = "Menyimpan ke Cloud...";

            let params = new URLSearchParams(dataKirim);

            fetch(SCRIPT_URL + "?" + params.toString(), { mode: "no-cors" })
                .then(() => {
                    alert("🎉 Soal/Tugas berhasil disimpan ke sistem!");
                    document.getElementById("input-soal").value = "";
                    if (jenis === "Pilihan Ganda") {
                        document.getElementById("input-opsia").value = "";
                        document.getElementById("input-opsib").value = "";
                        document.getElementById("input-opsic").value = "";
                        document.getElementById("input-opsid").value = "";
                        document.getElementById("input-kunci").value = "";
                        document.getElementById("input-gambar").value = "";
                    }
                    btn.disabled = false;
                    btn.innerText = "💾 Simpan Soal ke Google Sheets";
                    setTimeout(tampilkanDaftarSoal, 1500);
                })
                .catch(err => {
                    alert("Gagal menyimpan: " + err);
                    btn.disabled = false;
                    btn.innerText = "💾 Simpan Soal ke Google Sheets";
                });
        }

        async function tampilkanDaftarSoal() {
            let filterKelas = document.getElementById("filter-kelas").value;
            let filterMapel = document.getElementById("filter-mapel").value;
            let filterJenis = document.getElementById("filter-jenis").value;
            let tbody = document.getElementById("tabel-soal-body");
            tbody.innerHTML = `<tr><td colspan="6" class="text-center text-primary py-4">⏳ Memuat daftar soal...</td></tr>`;

            try {
                let response = await fetch(SCRIPT_URL + "?action=getSoal");
                let dataSoal = await response.json();
                tbody.innerHTML = "";

                let dataFiltered = dataSoal.filter(item => {
                    // Backend Code.gs sudah menyediakan huruf kecil & besar, kita ambil yang aman:
                    let kls = String(item.kelas || item.Kelas || "").trim();
                    let mpl = String(item.mapel || item.Mapel || "").trim();
                    let jns = String(item.jenis || item.Jenis || "").trim();
                    
                    let matchKelas = filterKelas ? kls === filterKelas : true;
                    let matchMapel = filterMapel ? mpl === filterMapel : true;
                    let matchJenis = filterJenis ? jns === filterJenis : true;

                    return matchKelas && matchMapel && matchJenis;
                });

                if (dataFiltered.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-4">Tidak ada soal yang ditemukan.</td></tr>`;
                    return;
                }

                dataFiltered.forEach((item, index) => {
                    let kls = item.kelas || item.Kelas || '-';
                    let mpl = item.mapel || item.Mapel || '-';
                    let jns = item.jenis || item.Jenis || '-';
                    let prt = item.pertanyaan || item.Pertanyaan || item.soal || '-';

                    let tr = document.createElement("tr");
                    tr.innerHTML = `
                        <td>${index + 1}</td>
                        <td><b>${kls}</b></td>
                        <td><span class="badge badge-secondary">${mpl}</span></td>
                        <td><span class="badge badge-info">${jns}</span></td>
                        <td class="text-left font-weight-bold">${prt}</td>
                        <td><span class="badge badge-success">Aktif</span></td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (e) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center text-danger py-4">Gagal memuat daftar soal dari server.</td></tr>`;
            }
        }
    </script>
</body>
</html>
