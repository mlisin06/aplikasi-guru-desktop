<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kerjakan Kuis & Tugas - Portal Siswa</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        .quiz-card { border-left: 5px solid #17a2b8; }
    </style>
</head>
<body class="bg-light">
    <div class="container mt-5 mb-5">
        <div class="card shadow p-4">
            <h3 class="text-info mb-3">🎓 Kerjakan Kuis & Tugas</h3>
            <p class="text-muted">Pilih kelas dan mata pelajaran Anda untuk mulai mengerjakan tugas dari guru.</p>
            
            <!-- Filter Pemilihan Soal -->
            <div class="form-row mb-4">
                <div class="form-group col-md-5">
                    <label>Pilih Kelas</label>
                    <select id="pilih-kelas" class="form-control" onchange="muatDaftarSoal()">
                        <option value="">-- Pilih Kelas --</option>
                        <option value="Kelas 1">Kelas 1</option>
                        <option value="Kelas 2">Kelas 2</option>
                        <option value="Kelas 3">Kelas 3</option>
                        <option value="Kelas 4">Kelas 4</option>
                        <option value="Kelas 5">Kelas 5</option>
                        <option value="Kelas 6">Kelas 6</option>
                    </select>
                </div>
                <div class="form-group col-md-5">
                    <label>Pilih Mata Pelajaran</label>
                    <select id="pilih-mapel" class="form-control" onchange="muatDaftarSoal()">
                        <option value="">-- Pilih Mata Pelajaran --</option>
                        <option value="PAIBP">PAIBP</option>
                        <option value="Pendidikan Pancasila">Pendidikan Pancasila</option>
                        <option value="Bahasa Indonesia">Bahasa Indonesia</option>
                        <option value="Matematika">Matematika</option>
                        <option value="IPAS">IPAS</option>
                        <option value="PJOK">PJOK</option>
                        <option value="Bahasa Inggris">Bahasa Inggris</option>
                        <option value="Bahasa Jawa">Bahasa Jawa</option>
                    </select>
                </div>
                <div class="form-group col-md-2 d-flex align-items-end">
                    <button class="btn btn-info btn-block font-weight-bold" onclick="muatDaftarSoal()">Cari</button>
                </div>
            </div>

            <hr>

            <!-- Area Tampil Soal -->
            <div id="kontainer-soal">
                <div class="alert alert-warning text-center">Silakan pilih Kelas dan Mata Pelajaran di atas untuk menampilkan soal atau tugas.</div>
            </div>

            <div class="mt-4">
                <a href="siswa.html" class="btn btn-secondary">&larr; Kembali ke Dashboard Siswa</a>
            </div>
        </div>
    </div>

    <script>
        // Fungsi untuk mengacak urutan huruf dari sebuah kata (untuk jenis Puzzle)
        function acakHuruf(kata) {
            if (!kata) return "";
            let arr = kata.trim().split("");
            for (let i = arr.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            let hasilAcak = arr.join(" ");
            if (hasilAcak.replace(/\s+/g, '') === kata.trim() && kata.length > 2) {
                return acakHuruf(kata);
            }
            return hasilAcak;
        }

        function muatDaftarSoal() {
            let kelas = document.getElementById("pilih-kelas").value;
            let mapel = document.getElementById("pilih-mapel").value;
            let kontainer = document.getElementById("kontainer-soal");

            if (!kelas || !mapel) {
                kontainer.innerHTML = `<div class="alert alert-warning text-center">Silakan pilih Kelas dan Mata Pelajaran terlebih dahulu.</div>`;
                return;
            }

            let dataSoal = JSON.parse(localStorage.getItem("dataSoal")) || [];
            let soalFilter = dataSoal.filter(s => s.kelas === kelas && s.mapel === mapel);

            if (soalFilter.length === 0) {
                kontainer.innerHTML = `<div class="alert alert-info text-center">Belum ada soal atau tugas untuk <b>${kelas} - ${mapel}</b> ini.</div>`;
                return;
            }

            let htmlContent = "";
            soalFilter.forEach((soal, index) => {
                htmlContent += `<div class="card quiz-card mb-4 p-3 shadow-sm">
                    <div class="d-flex justify-content-between">
                        <h5 class="text-primary">Soal No. ${index + 1} <small class="badge badge-secondary">${soal.jenis}</small></h5>
                    </div>
                    <p class="font-weight-bold mt-2">${soal.pertanyaan}</p>`;

                // 1. Pilihan Ganda
                if (soal.jenis === "Pilihan Ganda") {
                    htmlContent += `
                        <div class="form-check"><input class="form-check-input" type="radio" name="jawaban_${index}" value="A"><label class="form-check-label">A. ${soal.opsiA}</label></div>
                        <div class="form-check"><input class="form-check-input" type="radio" name="jawaban_${index}" value="B"><label class="form-check-label">B. ${soal.opsiB}</label></div>
                        <div class="form-check"><input class="form-check-input" type="radio" name="jawaban_${index}" value="C"><label class="form-check-label">C. ${soal.opsiC}</label></div>
                        <div class="form-check"><input class="form-check-input" type="radio" name="jawaban_${index}" value="D"><label class="form-check-label">D. ${soal.opsiD}</label></div>
                    `;
                } 
                // 2. Essay
                else if (soal.jenis === "Essay") {
                    htmlContent += `
                        <div class="form-group">
                            <textarea id="jawaban_${index}" class="form-control" rows="3" placeholder="Tulis jawaban essay Anda di sini..."></textarea>
                        </div>
                    `;
                }
                // 3. Mencocokkan Gambar
                else if (soal.jenis === "Mencocokkan Gambar") {
                    htmlContent += `
                        <div class="mb-3 text-center">
                            ${soal.gambar ? `<img src="${soal.gambar}" class="img-fluid rounded border mb-2" style="max-height: 200px;" alt="Gambar Soal">` : ''}
                            <p class="text-muted"><small>Perhatikan gambar di atas lalu tulis jawaban atau pasangannya.</small></p>
                        </div>
                        <div class="form-group">
                            <input type="text" id="jawaban_${index}" class="form-control" placeholder="Tulis jawaban pencocokan gambar...">
                        </div>
                    `;
                }
                // 4. Puzzle (Huruf Acak)
                else if (soal.jenis === "Puzzle") {
                    let kataAsli = soal.kunci || "SEKOLAH"; 
                    let hurufAcak = acakHuruf(kataAsli);
                    
                    htmlContent += `
                        <div class="mb-3 text-center bg-light p-3 border rounded">
                            <p class="text-muted mb-1"><small>Susun huruf-huruf acak berikut menjadi kata yang benar:</small></p>
                            <h3 class="text-danger font-weight-bold" style="letter-spacing: 5px;">${hurufAcak}</h3>
                        </div>
                        <div class="form-group">
                            <input type="text" id="jawaban_${index}" class="form-control font-weight-bold text-center" placeholder="Ketik kata yang benar di sini...">
                        </div>
                    `;
                }
                // 5. Menulis Ringkasan Materi
                else if (soal.jenis === "Menulis Ringkasan Materi") {
                    htmlContent += `
                        <div class="form-group">
                            <textarea id="jawaban_${index}" class="form-control" rows="5" placeholder="Tuliskan rangkuman atau ringkasan materi di sini..."></textarea>
                        </div>
                    `;
                }

                htmlContent += `</div>`;
            });

            htmlContent += `<button type="button" class="btn btn-success btn-lg btn-block font-weight-bold mt-3" onclick="kirimJawabanSiswa()">Kirim Semua Jawaban</button>`;
            kontainer.innerHTML = htmlContent;
        }

        function kirimJawabanSiswa() {
            let kelas = document.getElementById("pilih-kelas").value;
            let mapel = document.getElementById("pilih-mapel").value;
            
            let dataSoal = JSON.parse(localStorage.getItem("dataSoal")) || [];
            let soalFilter = dataSoal.filter(s => s.kelas === kelas && s.mapel === mapel);

            let totalDinilai = 0;
            let jumlahBenar = 0;

            soalFilter.forEach((soal, index) => {
                let diisi = false;
                let benar = false;

                if (soal.jenis === "Pilihan Ganda") {
                    let pilihan = document.querySelector(`input[name="jawaban_${index}"]:checked`);
                    if (pilihan) {
                        diisi = true;
                        if (pilihan.value.trim().toUpperCase() === soal.kunci.trim().toUpperCase()) {
                            benar = true;
                        }
                    }
                } else if (soal.jenis === "Puzzle") {
                    let inputPuzzle = document.getElementById(`jawaban_${index}`);
                    if (inputPuzzle && inputPuzzle.value.trim() !== "") {
                        diisi = true;
                        if (inputPuzzle.value.trim().toUpperCase() === soal.kunci.trim().toUpperCase()) {
                            benar = true;
                        }
                    }
                } else {
                    // Untuk Essay, Mencocokkan Gambar, dan Menulis Ringkasan Materi
                    let inputTeks = document.getElementById(`jawaban_${index}`);
                    if (inputTeks && inputTeks.value.trim() !== "") {
                        diisi = true;
                        benar = true; // Otomatis tuntas/benar jika diisi oleh siswa
                    }
                }

                // Hanya hitung soal yang dikerjakan / diisi oleh siswa
                if (diisi) {
                    totalDinilai++;
                    if (benar) {
                        jumlahBenar++;
                    }
                }
            });

            if (totalDinilai === 0) {
                alert("Harap kerjakan setidaknya satu soal atau tugas sebelum mengirim jawaban!");
                return;
            }

            // Hitung nilai akhir berdasarkan rata-rata soal yang dikerjakan saja
            let nilaiAkhir = Math.round((jumlahBenar / totalDinilai) * 100);

            let dataNilai = JSON.parse(localStorage.getItem("dataNilai")) || [];
            dataNilai.push({
                tanggal: new Date().toLocaleDateString(),
                kelas: kelas,
                mapel: mapel,
                nilai: nilaiAkhir,
                keterangan: `Mengerjakan ${totalDinilai}/${soalFilter.length} soal (${jumlahBenar} benar)`
            });
            localStorage.setItem("dataNilai", JSON.stringify(dataNilai));

            alert(`Jawaban berhasil dikirim!\n\nRingkasan:\n- Dikerjakan: ${totalDinilai} dari ${soalFilter.length} soal\n- Nilai Akhir (Rata-rata): ${nilaiAkhir}`);
            window.location.href = "siswa.html";
        }
    </script>
</body>
</html>
